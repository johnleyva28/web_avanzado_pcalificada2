<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipos de Medicamento - Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar-farmacia"></div>

  <main class="contenedor-principal">
    <div id="contenedor-alerta"></div>

    <div class="cabecera-pagina">
      <h1><i class="bi bi-tags"></i> Tipos de Medicamento</h1>
      <button class="btn-nuevo" id="btn-nuevo-tipo" onclick="abrirModalCrear()">
        <i class="bi bi-plus-lg"></i> Nuevo Tipo
      </button>
    </div>

    <div class="tarjeta-tabla">
      <table class="tabla-farmacia">
        <thead>
          <tr>
            <th style="width: 60px;">ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th style="width: 110px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-tipos">
          <tr><td colspan="4" class="sin-datos">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal para crear/editar tipo -->
  <div class="modal fade modal-farmacia" id="modal-tipo" tabindex="-1" aria-labelledby="titulo-modal-tipo" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="titulo-modal-tipo">Nuevo Tipo de Medicamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="form-tipo" novalidate>
          <div class="modal-body">
            <input type="hidden" id="tipo-id" />

            <div class="mb-3">
              <label for="tipo-nombre" class="form-label">Nombre del tipo</label>
              <input
                type="text"
                class="form-control"
                id="tipo-nombre"
                name="nombre"
                maxlength="60"
                required
              />
              <div id="error-tipo-nombre" class="texto-error-campo"></div>
            </div>

            <div class="mb-3">
              <label for="tipo-descripcion" class="form-label">Descripción</label>
              <textarea
                class="form-control"
                id="tipo-descripcion"
                name="descripcion"
                rows="3"
                maxlength="200"
                placeholder="Describe brevemente este tipo de medicamento (opcional)"
              ></textarea>
              <div id="error-tipo-descripcion" class="texto-error-campo"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/tipos.js"></script>
</body>
</html>

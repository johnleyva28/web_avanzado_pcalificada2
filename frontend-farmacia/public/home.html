<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel principal del sistema de gestión farmacéutica" />
  <meta name="theme-color" content="#0d2c54" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
  <title>Inicio · Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-DeN988K4Vg0cDrUgVHjrVM0+ogMrXsv0AZYIH40/9VGpjC7zi8TFGdnPwL1EkU/T" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar-farmacia"></div>

  <main class="contenedor-principal">
    <section class="tarjeta-bienvenida">
      <div class="bienvenida-texto">
        <h1>Hola, <span id="nombre-usuario">Usuario</span> 👋</h1>
        <p>Selecciona el módulo al que deseas acceder desde las tarjetas de abajo.</p>
      </div>
    </section>

    <div class="stats-row" id="stats-row">
      <div class="stat-tile stat-tile--skeleton">
        <div class="stat-icono"><i class="bi bi-capsule"></i></div>
        <div class="stat-cuerpo">
          <span class="stat-valor">—</span>
          <span class="stat-etiqueta">Medicamentos</span>
        </div>
      </div>
      <div class="stat-tile stat-tile--skeleton">
        <div class="stat-icono"><i class="bi bi-tags"></i></div>
        <div class="stat-cuerpo">
          <span class="stat-valor">—</span>
          <span class="stat-etiqueta">Tipos</span>
        </div>
      </div>
      <div class="stat-tile stat-tile--skeleton">
        <div class="stat-icono"><i class="bi bi-box-seam"></i></div>
        <div class="stat-cuerpo">
          <span class="stat-valor">—</span>
          <span class="stat-etiqueta">Stock total</span>
        </div>
      </div>
    </div>

    <h2 class="mb-3" style="color: var(--azul-marino); font-size: 1.15rem; font-weight: 700;">
      <i class="bi bi-grid-3x3-gap"></i> Módulos del sistema
    </h2>
    <div id="cuadricula-modulos" class="cuadricula-tarjetas"></div>
  </main>

  <footer class="pie-pagina">
    <span>Farmacia · Sistema de gestión</span>
    <span class="separador-pie">·</span>
    <span>Desarrollado con Node, Express y Bootstrap</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/home.js"></script>
</body>
</html>

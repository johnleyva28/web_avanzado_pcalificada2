<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú principal - Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar-farmacia"></div>

  <main class="contenedor-principal">
    <section class="tarjeta-bienvenida">
      <h1>Bienvenido, <span id="nombre-usuario">Usuario</span></h1>
      <p>
        Has iniciado sesión como <strong id="rol-usuario">Usuario</strong>.
        Selecciona el módulo al que deseas acceder desde las tarjetas de abajo.
      </p>
    </section>

    <h2 class="mb-3" style="color: var(--color-primario-oscuro); font-size: 1.2rem;">
      <i class="bi bi-grid-3x3-gap"></i> Módulos del sistema
    </h2>
    <div id="cuadricula-modulos" class="cuadricula-tarjetas">
      <div class="tarjeta-modulo bloqueada">
        <div class="icono"><i class="bi bi-hourglass-split"></i></div>
        <h3>Cargando...</h3>
        <p>Por favor espera.</p>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/home.js"></script>
</body>
</html>

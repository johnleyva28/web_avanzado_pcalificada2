<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Farmacia">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2c54"/>
      <stop offset="100%" stop-color="#1e4a8a"/>
    </linearGradient>
    <linearGradient id="capsula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a33"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
  </defs>
  <!-- Fondo con bordes redondeados -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Cápsula inclinada -->
  <g transform="rotate(-30 32 32)">
    <rect x="10" y="26" width="44" height="12" rx="6" fill="url(#capsula)"/>
    <rect x="10" y="26" width="22" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
    <line x1="32" y1="26" x2="32" y2="38" stroke="#0d2c54" stroke-width="0.6" opacity="0.4"/>
  </g>
  <!-- Cruz médica blanca -->
  <g transform="translate(32 32)">
    <rect x="-3" y="-10" width="6" height="20" rx="1.5" fill="#ffffff"/>
    <rect x="-10" y="-3" width="20" height="6" rx="1.5" fill="#ffffff"/>
  </g>
</svg>

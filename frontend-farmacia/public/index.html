<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de gestión farmacéutica - Iniciar sesión" />
  <meta name="theme-color" content="#0d2c54" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
  <title>Iniciar sesión · Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-DeN988K4Vg0cDrUgVHjrVM0+ogMrXsv0AZYIH40/9VGpjC7zi8TFGdnPwL1EkU/T" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-split">
    <aside class="auth-brand" aria-hidden="true">
      <div class="auth-brand-inner">
        <div class="auth-logo">
          <svg viewBox="0 0 64 64" width="56" height="56">
            <rect x="2" y="2" width="60" height="60" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
            <g transform="rotate(-30 32 32)">
              <rect x="10" y="26" width="44" height="12" rx="6" fill="#ff6a33"/>
              <rect x="10" y="26" width="22" height="12" rx="6" fill="#ffffff"/>
            </g>
            <g transform="translate(32 32)">
              <rect x="-3" y="-10" width="6" height="20" rx="1.5" fill="#ffffff"/>
              <rect x="-10" y="-3" width="20" height="6" rx="1.5" fill="#ffffff"/>
            </g>
          </svg>
          <h1>Farmacia</h1>
        </div>
        <p class="auth-tagline">Sistema de gestión de inventario y catálogo de medicamentos.</p>
        <ul class="auth-features">
          <li><i class="bi bi-shield-check"></i> Acceso seguro con JWT</li>
          <li><i class="bi bi-people"></i> Roles: Admin, Moderador, Usuario</li>
          <li><i class="bi bi-capsule"></i> Inventario en tiempo real</li>
        </ul>
      </div>
    </aside>

    <section class="auth-panel">
      <div class="tarjeta-auth">
        <div class="logo">
          <i class="bi bi-capsule"></i> Farmacia
        </div>
        <p class="subtitulo">Ingresa tus credenciales para acceder al sistema</p>

        <div id="mensaje-global" class="text-center mb-3"></div>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="login-email" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="login-email"
              name="email"
              placeholder="ejemplo@correo.com"
              autocomplete="email"
              required
            />
            <div id="error-login-email" class="texto-error-campo"></div>
          </div>

          <div class="mb-3">
            <label for="login-password" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="login-password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <div id="error-login-password" class="texto-error-campo"></div>
          </div>

          <button type="submit" id="btn-login" class="btn-principal">
            Iniciar sesión
          </button>

          <a href="register.html" class="enlace-secundario">
            ¿No tienes cuenta? Regístrate aquí
          </a>
        </form>
      </div>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

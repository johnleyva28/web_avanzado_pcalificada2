<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor-auth">
    <div class="tarjeta-auth">
      <div class="logo">
        <i class="bi bi-capsule"></i> Farmacia
      </div>
      <p class="subtitulo">Ingresa tus credenciales para acceder al sistema</p>

      <div id="mensaje-global" class="text-center mb-3"></div>

      <form id="form-login" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="login-email"
            name="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          />
          <div id="error-login-email" class="texto-error-campo"></div>
        </div>

        <div class="mb-3">
          <label for="login-password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <div id="error-login-password" class="texto-error-campo"></div>
        </div>

        <button type="submit" id="btn-login" class="btn-principal">
          Iniciar sesión
        </button>

        <a href="register.html" class="enlace-secundario">
          ¿No tienes cuenta? Regístrate aquí
        </a>
      </form>

      <hr class="my-4" />
      <small class="text-muted d-block text-center" style="font-size: 0.78rem;">
        <strong>Usuarios de prueba:</strong><br />
        admin@farmacia.com / admin123 &nbsp;·&nbsp;
        mod@farmacia.com / mod123 &nbsp;·&nbsp;
        cliente@farmacia.com / cliente123
      </small>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

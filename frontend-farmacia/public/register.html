<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de usuario - Farmacia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor-auth">
    <div class="tarjeta-auth">
      <div class="logo">
        <i class="bi bi-capsule"></i> Farmacia
      </div>
      <p class="subtitulo">Crea tu cuenta para acceder al sistema</p>

      <div id="mensaje-global" class="text-center mb-3"></div>

      <form id="form-registro" novalidate>
        <div class="mb-3">
          <label for="reg-nombre" class="form-label">Nombre completo</label>
          <input
            type="text"
            class="form-control"
            id="reg-nombre"
            name="nombre"
            placeholder="Tu nombre"
            autocomplete="name"
            maxlength="80"
            required
          />
          <div id="error-reg-nombre" class="texto-error-campo"></div>
        </div>

        <div class="mb-3">
          <label for="reg-email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="reg-email"
            name="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          />
          <div id="error-reg-email" class="texto-error-campo"></div>
        </div>

        <div class="mb-3">
          <label for="reg-password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="reg-password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <div id="error-reg-password" class="texto-error-campo"></div>
        </div>

        <div class="mb-3">
          <label for="reg-confirmar" class="form-label">Confirmar contraseña</label>
          <input
            type="password"
            class="form-control"
            id="reg-confirmar"
            name="confirmar"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            required
          />
          <div id="error-reg-confirmar" class="texto-error-campo"></div>
        </div>

        <div class="mb-3">
          <label for="reg-rol" class="form-label">Tipo de usuario</label>
          <select class="form-select" id="reg-rol" name="rol">
            <option value="cliente" selected>Usuario (cliente)</option>
            <option value="moderador">Moderador</option>
            <option value="admin">Administrador</option>
          </select>
          <small class="text-muted">En un sistema real el registro público solo sería "Usuario". Este selector existe con fines académicos.</small>
        </div>

        <button type="submit" id="btn-registrar" class="btn-principal">
          Crear cuenta
        </button>

        <a href="index.html" class="enlace-secundario">
          ¿Ya tienes cuenta? Inicia sesión
        </a>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
